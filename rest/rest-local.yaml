apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-local
spec:
  replicas: 1
  selector:
    matchLabels: {app: rest-local}
  template:
    metadata:
      labels: {app: rest-local}
    spec:
      containers:
        - name: rest
          image: demucs-rest:local
          imagePullPolicy: Never
          ports: [{containerPort: 5000}]
          env:
            - {name: REDIS_HOST, value: redis}
            - {name: REDIS_PORT, value: "6379"}
            - {name: MINIO_ENDPOINT, value: 'minio-local:9000'}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-local-credentials, key: root-user}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-local-credentials, key: root-password}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rest-local
spec:
  selector: {app: rest-local}
  ports:
    - {port: 5000, targetPort: 5000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rest-local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '16m'
spec:
  ingressClassName: nginx
  rules:
    - host: demucs.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rest-local
                port: {number: 5000}
