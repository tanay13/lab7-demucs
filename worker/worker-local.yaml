apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-local
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: worker-local}
  template:
    metadata:
      labels: {app: worker-local}
    spec:
      containers:
        - name: worker
          image: demucs-worker:local
          imagePullPolicy: Never
          env:
            - {name: REDIS_HOST, value: redis}
            - {name: REDIS_PORT, value: "6379"}
            - {name: MINIO_ENDPOINT, value: 'minio-local:9000'}
            - {name: TORCH_HOME, value: /models}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-local-credentials, key: root-user}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-local-credentials, key: root-password}
          resources:
            requests: {cpu: 1000m, memory: 3Gi}
            limits: {memory: 7Gi}
          volumeMounts:
            - {name: models, mountPath: /models}
      volumes:
        - name: models
          emptyDir: {}
